name: Publish

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: npm install
      - name: Build project
        run: npx nx run @onlyoffice/alfresco-extension:build
      - name: Publish to npm
        run: npx nx run @onlyoffice/alfresco-extension:nx-release-publish
